# Hub（Cloudflare Workers）のコードだけを公開し直す。手動実行の時だけ動かす。
# - Secret・GitHub App の設定は変えない（それは hub/scripts/deploy.mjs）
# - Cloudflare へは、この Mac の wrangler のログインを使う（hub-signing-key と同じ）
name: hub-deploy
on:
  manual: {}
jobs:
  deploy:
    name: Hub を公開し直す
    runs-on: macos
    timeout: 15
    steps:
      - uses: checkout
      - name: 試験
        working-directory: hub
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund > /dev/null
          npx tsc --noEmit -p .
          npx vitest run
      - name: 公開する
        working-directory: hub
        run: |
          set -euo pipefail
          npx wrangler deploy
          curl -fsS --max-time 20 https://upbeater-hub.twilight-star-9d9d.workers.dev/v1/keys > /dev/null && echo "Hub は動いています"
